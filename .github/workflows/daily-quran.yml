# Daily post: round-robin social slots + random unseen video (tools/daily_social_post.py).
# For static manifest URLs only, swap the run step to: python main.py
# and remove the yt-dlp install line. TikTok/IG often fail here without cookies —
# prefer running tools/daily_social_post.py on your PC with Task Scheduler if needed.

name: Daily Quran post

on:
  schedule:
    # 20:30 UTC = 23:30 (11:30 PM) in UTC+3 (e.g. Addis Ababa). GitHub cron is UTC-only.
    - cron: "30 20 * * *"
  workflow_dispatch:

concurrency:
  group: daily-quran-post
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirement.txt

      - name: Install dependencies
        run: pip install -r requirement.txt

      - name: Post to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL_ID: ${{ secrets.TELEGRAM_CHANNEL_ID }}
        run: python tools/daily_social_post.py

      - name: Commit counter and ingest state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/counter.json data/ingest_state.json
          if git diff --staged --quiet; then
            echo "No state changes to commit."
          else
            git commit -m "chore: bump DailyQuran state after post [skip ci]"
            git push
          fi
